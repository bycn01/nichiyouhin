<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=https://nichiyouhin.sana-family.workers.dev/">
<title>日用品こうかん帳（引っ越しました）</title>
<style>
  :root { --bg: #f6f4ef; --text: #2b2a28; --accent: #3c7a5a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1b19; --text: #ece9e2; --accent: #6fbf94; } }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; text-align: center; padding: 80px 16px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<p>日用品こうかん帳は新しい場所に移りました。<br><a href="https://nichiyouhin.sana-family.workers.dev/">新しいページを開く</a></p>
<script>
// 前の版の「オフライン用の保存」を片づけてから移動する
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
location.replace("https://nichiyouhin.sana-family.workers.dev/");
</script>
</body>
</html>
