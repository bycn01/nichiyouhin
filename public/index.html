<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小林家">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>小林家</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #2b2a28;
    --sub: #77736b;
    --line: #e4e0d7;
    --accent: #3c7a5a;
    --accent-weak: #e3efe8;
    --ok: #3c7a5a;
    --soon: #c98a12;
    --soon-weak: #fbf1dc;
    --over: #c2453a;
    --over-weak: #fae4e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --card: #262522;
      --text: #ece9e2;
      --sub: #a29d93;
      --line: #3a3833;
      --accent: #6fbf94;
      --accent-weak: #24372c;
      --ok: #6fbf94;
      --soon: #e3b04f;
      --soon-weak: #3b3120;
      --over: #ec7b70;
      --over-weak: #402523;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 96px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 16px; }
  h1 { font-size: 1.35rem; margin: 0; }
  .today { color: var(--sub); font-size: .85rem; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .sum { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; }
  .sum b { display: block; font-size: 1.5rem; }
  .sum span { font-size: .8rem; color: var(--sub); }
  .sum.over b { color: var(--over); }
  .sum.soon b { color: var(--soon); }
  .sum.ok b { color: var(--ok); }
  .sum.active { outline: 2px solid var(--accent); }

  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 5px 12px; font-size: .85rem; cursor: pointer; }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .item.over { border-left: 6px solid var(--over); }
  .item.soon { border-left: 6px solid var(--soon); }
  .item.ok { border-left: 6px solid var(--ok); }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .icon { font-size: 1.6rem; width: 2rem; text-align: center; }
  .name { font-weight: bold; font-size: 1.05rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .badge { font-size: .8rem; font-weight: bold; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
  .badge.over { background: var(--over-weak); color: var(--over); }
  .badge.soon { background: var(--soon-weak); color: var(--soon); }
  .badge.ok { background: var(--accent-weak); color: var(--ok); }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin: 10px 0 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; }
  .meta { font-size: .8rem; color: var(--sub); display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .memo { font-size: .85rem; margin-top: 4px; white-space: pre-wrap; }
  .actions { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: .9rem; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; flex: 1; }
  .btn.danger { color: var(--over); }

  .empty { text-align: center; color: var(--sub); padding: 40px 10px; }

  .fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 2rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }


  dialog { border: none; border-radius: 16px; padding: 0; width: min(520px, calc(100% - 24px)); background: var(--card); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 18px; }
  .dlg h2 { margin: 0 0 12px; font-size: 1.15rem; }
  label { display: block; font-size: .85rem; color: var(--sub); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  textarea { min-height: 60px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
  .presets .chip { font-size: .8rem; }
  .interval { display: flex; gap: 6px; }
  .interval input { flex: 1; }
  .interval select { width: 6.5em; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .history { font-size: .8rem; color: var(--sub); margin-top: 6px; }

  .notice { background: var(--soon-weak); color: var(--soon); border-radius: 10px; padding: 8px 12px; font-size: .85rem; margin-bottom: 12px; }
  .busy { opacity: .6; pointer-events: none; }
  [hidden] { display: none !important; }

  /* 合言葉の画面は画面にぴったり固定して、スワイプで動かないようにする */
  .gate { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; display: flex; align-items: flex-start; justify-content: center; padding: calc(16vh + env(safe-area-inset-top, 0px)) 16px 24px; }
  html:has(.gate:not([hidden])), html:has(.gate:not([hidden])) body { overflow: hidden; overscroll-behavior: none; }
  .gate-box { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; text-align: center; }
  .gate-box img { width: 72px; height: 72px; border-radius: 16px; }
  .gate-box h1 { margin: 10px 0 4px; }
  .gate-box p { color: var(--sub); font-size: .9rem; margin: 0 0 16px; }
  .gate-box .btn.primary { width: 100%; margin-top: 12px; padding: 11px; }
  .err { color: var(--over); font-size: .85rem; margin-top: 10px; min-height: 1.3em; }

  /* 種類（交換・お手入れ／期限日／有効期限・保証）の切り替え */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 4px; }
  .seg button { border: none; background: none; color: var(--sub); border-radius: 9px; padding: 8px 4px; font-size: .82rem; cursor: pointer; line-height: 1.3; }
  .seg button.active { background: var(--accent); color: #fff; font-weight: bold; }
  .kind-help { font-size: .78rem; color: var(--sub); margin: 4px 2px 0; }
  .kind-tag { font-size: .7rem; color: var(--sub); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; margin-left: 6px; font-weight: normal; vertical-align: 2px; white-space: nowrap; }

  .done-sec { margin-top: 24px; }
  .done-sec summary { cursor: pointer; color: var(--sub); font-size: .9rem; padding: 6px 2px; }
  .done-sec .item { opacity: .75; border-left: 6px solid var(--line); }
  .done-sec .name { text-decoration: line-through; text-decoration-color: var(--sub); }
</style>
</head>
<body>
<!-- 合言葉の画面 -->
<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm">
    <img src="icon-192.png" alt="">
    <h1>小林家</h1>
    <p>家族の合言葉を入れてください</p>
    <input id="gPass" type="text" placeholder="合言葉（ひらがなでもOK）" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
    <button class="btn primary" type="submit">はじめる</button>
    <div class="err" id="gErr"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <h1>🏠 小林家</h1>
    <div class="today" id="today"></div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="summary">
    <div class="sum over" data-st="over"><b id="cOver">0</b><span>期限切れ</span></div>
    <div class="sum soon" data-st="soon"><b id="cSoon">0</b><span>もうすぐ</span></div>
    <div class="sum ok" data-st="ok"><b id="cOk">0</b><span>まだ大丈夫</span></div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>

  <details class="done-sec" id="doneSec" hidden>
    <summary id="doneSum"></summary>
    <div class="list" id="doneList"></div>
  </details>
</div>

<button class="fab" id="btnAdd" aria-label="追加" hidden>＋</button>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="form">
    <h2 id="dlgTitle">追加</h2>
    <div class="seg" id="kindSeg">
      <button type="button" data-kind="repeat">交換・<br>お手入れ</button>
      <button type="button" data-kind="once">期限日</button>
      <button type="button" data-kind="period">有効期限・<br>保証</button>
    </div>
    <div class="kind-help" id="kindHelp"></div>

    <div id="presetArea">
      <label>よくあるものから選ぶ（タップで入力）</label>
      <div class="presets" id="presets"></div>
    </div>
    <label for="fName">名前</label>
    <input id="fName" required>
    <label for="fCat">分類</label>
    <select id="fCat"></select>

    <!-- 交換・お手入れ -->
    <div data-for="repeat">
      <div class="two">
        <div>
          <label for="fInterval">くり返しの目安</label>
          <div class="interval">
            <input id="fInterval" type="number" min="1" value="30">
            <select id="fUnit">
              <option value="1">日ごと</option>
              <option value="7">週ごと</option>
              <option value="30">か月ごと</option>
              <option value="365">年ごと</option>
            </select>
          </div>
        </div>
        <div>
          <label for="fStart">前回やった日</label>
          <input id="fStart" type="date">
        </div>
      </div>
    </div>

    <!-- 期限日・有効期限 -->
    <div data-for="once period">
      <div class="two">
        <div>
          <label for="fDue" id="fDueLabel">期限日</label>
          <input id="fDue" type="date">
        </div>
        <div data-for="once">
          <label for="fCycle">くり返し</label>
          <select id="fCycle">
            <option value="0">くり返さない</option>
            <option value="1">毎月</option>
            <option value="3">3か月ごと</option>
            <option value="6">半年ごと</option>
            <option value="12">毎年</option>
            <option value="24">2年ごと</option>
            <option value="36">3年ごと</option>
            <option value="60">5年ごと</option>
            <option value="120">10年ごと</option>
          </select>
        </div>
        <div data-for="period">
          <label for="fPStart">使い始めた日（なくてもOK）</label>
          <input id="fPStart" type="date">
        </div>
      </div>
    </div>

    <label for="fNotice">「もうすぐ」にする時期</label>
    <select id="fNotice">
      <option value="">おまかせ</option>
      <option value="3">3日前から</option>
      <option value="7">1週間前から</option>
      <option value="14">2週間前から</option>
      <option value="30">1か月前から</option>
      <option value="60">2か月前から</option>
      <option value="90">3か月前から</option>
      <option value="180">半年前から</option>
    </select>
    <label for="fMemo">メモ</label>
    <textarea id="fMemo" placeholder="例：〇〇ドラッグで3本セット／保証書は棚の青いファイル"></textarea>
    <div class="history" id="fHistory"></div>
    <div class="dlg-actions">
      <button type="button" class="btn" id="btnCancel">やめる</button>
      <button type="submit" class="btn primary" style="flex:none">保存</button>
    </div>
  </form>
</dialog>

<script>
const CACHE_KEY = "nichiyouhin-cache";
const CATS = [
  { id: "bath", label: "洗面・お風呂", icon: "🪥" },
  { id: "kitchen", label: "キッチン", icon: "🍳" },
  { id: "clean", label: "掃除・洗濯", icon: "🧽" },
  { id: "home", label: "家電・住まい", icon: "🏠" },
  { id: "bed", label: "寝具・衣類", icon: "🛏️" },
  { id: "car", label: "車・自転車", icon: "🚗" },
  { id: "docs", label: "書類・手続き", icon: "📄" },
  { id: "money", label: "お金・支払い", icon: "💴" },
  { id: "health", label: "健康・病院", icon: "🩺" },
  { id: "kids", label: "こども", icon: "🧸" },
  { id: "food", label: "食品・備蓄・薬", icon: "🥫" },
  { id: "other", label: "その他", icon: "📦" },
];
const KINDS = {
  repeat: { label: "交換・お手入れ", help: "前回やった日から数えて、次の時期を知らせます。「やった」を押すと次の時期が決まります。" },
  once:   { label: "期限日", help: "日付が決まっているもの。「毎年」などを選ぶと、完了したとき次の期限日に進みます。" },
  period: { label: "有効期限・保証", help: "いつまで有効かを見ておくもの。期限が近づくと知らせます。" },
};
// よくあるもの：[名前, 分類, 交換・お手入れは日数／期限日はくり返しの月数]
const PRESETS = {
  repeat: [
    ["歯ブラシ", "bath", 30], ["カミソリの刃", "bath", 14], ["バスタオル", "bath", 365],
    ["キッチンスポンジ", "kitchen", 30], ["浄水器カートリッジ", "kitchen", 90], ["排水口ネット", "kitchen", 7],
    ["お風呂のスポンジ", "clean", 60], ["洗濯槽の掃除", "clean", 30], ["トイレブラシ", "clean", 180],
    ["エアコンフィルター掃除", "home", 14], ["換気扇フィルター", "home", 90], ["空気清浄機フィルター", "home", 365],
    ["火災報知器の電池", "home", 3650], ["枕", "bed", 730], ["車のオイル交換", "car", 180],
    ["防災グッズの見直し", "food", 365],
  ],
  once: [
    ["車検", "car", 24], ["自動車保険の更新", "car", 12], ["自動車税", "money", 12],
    ["固定資産税", "money", 3], ["火災保険の更新", "money", 0], ["スマホの契約更新", "money", 24],
    ["運転免許の更新", "docs", 0], ["健康診断", "health", 12], ["歯医者の定期検診", "health", 6],
    ["予防接種", "kids", 0], ["粗大ごみの日", "other", 0],
  ],
  period: [
    ["家電の保証", "home", 0], ["パスポート", "docs", 0], ["マイナンバーカード", "docs", 0],
    ["保険証", "docs", 0], ["防災食の賞味期限", "food", 0], ["常備薬の使用期限", "food", 0],
  ],
};

// ---- このスマホだけの保存（失敗しても動くように） ----
function getLocal(k) { try { return localStorage.getItem(k); } catch { return null; } }
function setLocal(k, v) { try { localStorage.setItem(k, v); } catch {} }

let items = [];
let online = true;
let filterCat = "all";
let filterSt = null;
let editingId = null;
let formKind = "repeat";

// ---- サーバーとのやりとり ----
class NeedLogin extends Error {}
async function api(path, data) {
  let res;
  try {
    res = await fetch("/api/" + path, data === undefined ? {} : {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data),
    });
  } catch {
    throw new Error("インターネットにつながっていないようです");
  }
  const body = await res.json().catch(() => ({}));
  if (res.status === 401 && body.needLogin) throw new NeedLogin();
  if (!res.ok) throw new Error(body.error || "うまくいきませんでした");
  return body;
}

function setItems(data) {
  items = data.items || [];
  setLocal(CACHE_KEY, JSON.stringify(items));
}

async function refresh() {
  try {
    setItems(await api("items"));
    online = true;
    showApp();
  } catch (e) {
    if (e instanceof NeedLogin) return showGate();
    // つながらないときは、前に見た内容を表示だけする
    online = false;
    try { items = JSON.parse(getLocal(CACHE_KEY)) || []; } catch { items = []; }
    showApp();
  }
}

// 画面の操作をサーバーに送る。終わったら最新の一覧で描き直す
async function send(path, data) {
  document.body.classList.add("busy");
  try {
    setItems(await api(path, data));
    online = true;
    render();
    return true;
  } catch (e) {
    if (e instanceof NeedLogin) { showGate(); return false; }
    alert(e.message);
    return false;
  } finally {
    document.body.classList.remove("busy");
  }
}

// ---- 合言葉 ----
function showGate() {
  gate.hidden = false; app.hidden = true; btnAdd.hidden = true;
  gPass.focus();
}
gateForm.addEventListener("submit", async e => {
  e.preventDefault();
  gErr.textContent = "";
  try {
    await api("login", { pass: gPass.value });
    gPass.value = "";
    await refresh();
  } catch (err) {
    gErr.textContent = err.message;
  }
});

function showApp() {
  gate.hidden = true; app.hidden = false; btnAdd.hidden = !online;
  render();
}

// ---- 日付 ----
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function parse(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate()+n); return d; }
function diffDays(a, b) { return Math.round((a - b) / 86400000); }
// 今年の日付は「10/27」、ほかの年は「2028/10/27」
function fmt(d) {
  if (typeof d === "string") d = parse(d);
  return d.getFullYear() === new Date().getFullYear() ? `${d.getMonth()+1}/${d.getDate()}` : fmtFull(d);
}
function fmtFull(d) { if (typeof d === "string") d = parse(d); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }

function intervalText(days) {
  if (days % 365 === 0) return `${days/365}年ごと`;
  if (days % 30 === 0) return `${days/30}か月ごと`;
  if (days % 7 === 0) return `${days/7}週間ごと`;
  return `${days}日ごと`;
}
function cycleText(m) {
  if (!m) return "";
  if (m === 1) return "毎月";
  if (m === 12) return "毎年";
  if (m % 12 === 0) return `${m/12}年ごと`;
  if (m === 6) return "半年ごと";
  return `${m}か月ごと`;
}
// 残りの日数を読みやすく（遠い先は「か月」「年」で）
function leftText(left) {
  if (left < 60) return `あと${left}日`;
  if (left < 730) return `あと${Math.floor(left / 30)}か月`;
  return `あと${Math.floor(left / 365)}年`;
}

// 期限までの残りと、状態（over 期限切れ / soon もうすぐ / ok まだ大丈夫）
function status(it) {
  const t = parse(todayStr());
  let due, ratio = null, used = null;
  if (it.kind === "repeat") {
    due = addDays(it.start, it.interval);
    used = diffDays(t, parse(it.start));
    ratio = used / it.interval;
  } else {
    due = parse(it.due);
    if (it.kind === "period" && it.start) {
      const total = diffDays(due, parse(it.start));
      if (total > 0) ratio = diffDays(t, parse(it.start)) / total;
    }
  }
  const left = diffDays(due, t);
  const notice = it.notice != null ? it.notice
    : it.kind === "repeat" ? Math.min(7, Math.ceil(it.interval * 0.25))
    : it.kind === "once" ? 14 : 30;
  const st = left < 0 ? "over" : left <= notice ? "soon" : "ok";
  return { due, left, used, st, ratio: ratio == null ? null : Math.min(1, Math.max(0, ratio)) };
}

// ---- 描画 ----
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cat(id) { return CATS.find(c => c.id === id) || CATS[CATS.length-1]; }

function render() {
  today.textContent = "今日 " + fmtFull(todayStr());
  notice.hidden = online;
  notice.textContent = "インターネットにつながっていないため、前に見た内容を表示しています（変更はできません）";

  const active = items.filter(i => !i.done);
  const done = items.filter(i => i.done);
  const withSt = active.map(it => ({ it, s: status(it) }));
  const count = { over: 0, soon: 0, ok: 0 };
  withSt.forEach(x => count[x.s.st]++);
  cOver.textContent = count.over; cSoon.textContent = count.soon; cOk.textContent = count.ok;
  document.querySelectorAll(".sum").forEach(el => el.classList.toggle("active", el.dataset.st === filterSt));

  // 分類フィルター
  const used = new Set(active.map(i => i.cat));
  if (filterCat !== "all" && !used.has(filterCat)) filterCat = "all";
  const chips = [`<button class="chip ${filterCat==="all"?"active":""}" data-cat="all">すべて</button>`]
    .concat(CATS.filter(c => used.has(c.id)).map(c =>
      `<button class="chip ${filterCat===c.id?"active":""}" data-cat="${c.id}">${c.icon} ${c.label}</button>`));
  filters.innerHTML = chips.join("");

  const shown = withSt
    .filter(x => filterCat === "all" || x.it.cat === filterCat)
    .filter(x => !filterSt || x.s.st === filterSt)
    .sort((a, b) => a.s.left - b.s.left || a.it.name.localeCompare(b.it.name, "ja"));

  if (!active.length) {
    list.innerHTML = `<div class="empty">まだ何も登録されていません。<br>右下の <b>＋</b> から追加してください。</div>`;
  } else if (!shown.length) {
    list.innerHTML = `<div class="empty">この条件に当てはまるものはありません。</div>`;
  } else {
    list.innerHTML = shown.map(({ it, s }) => card(it, s)).join("");
  }

  // 完了したもの（新しく完了した順）
  doneSec.hidden = !done.length;
  doneSum.textContent = `完了したもの（${done.length}）`;
  doneList.innerHTML = done
    .sort((a, b) => (b.doneAt || "").localeCompare(a.doneAt || ""))
    .map(doneCard).join("");
}

function card(it, s) {
  const c = cat(it.cat);
  const dis = online ? "" : "disabled";
  let badge;
  if (s.left < 0) badge = it.kind === "period" ? `${-s.left}日前に切れた` : `${-s.left}日すぎ`;
  else if (s.left === 0) badge = "今日まで";
  else badge = leftText(s.left);

  let meta, primary;
  if (it.kind === "repeat") {
    meta = [`次は ${fmt(s.due)}`, intervalText(it.interval), `前回 ${fmt(it.start)}（${s.used}日目）`];
    primary = `<button class="btn primary" data-act="done" data-id="${it.id}" ${dis}>✅ 今日やった</button>`;
  } else if (it.kind === "once") {
    meta = [`期限 ${fmtFull(s.due)}`].concat(it.cycle ? [cycleText(it.cycle)] : []);
    primary = `<button class="btn primary" data-act="done" data-id="${it.id}" ${dis}>✅ 完了</button>`;
  } else {
    meta = [`${fmtFull(s.due)} まで有効`].concat(it.start ? [`使い始め ${fmt(it.start)}`] : []);
    primary = `<button class="btn primary" data-act="renew" data-id="${it.id}" ${dis}>🔄 更新した</button>`;
  }
  return `<div class="item ${s.st}">
    <div class="row1">
      <div class="icon">${c.icon}</div>
      <div class="name">${esc(it.name)}<span class="kind-tag">${KINDS[it.kind].label}</span></div>
      <span class="badge ${s.st}">${badge}</span>
    </div>
    ${s.ratio != null ? `<div class="bar"><i style="width:${s.ratio*100}%;background:var(--${s.st})"></i></div>` : `<div style="height:8px"></div>`}
    <div class="meta">${meta.map(m => `<span>${m}</span>`).join("")}</div>
    ${it.memo ? `<div class="memo">📝 ${esc(it.memo)}</div>` : ""}
    <div class="actions">
      ${primary}
      <button class="btn" data-act="edit" data-id="${it.id}" ${dis}>編集</button>
      <button class="btn danger" data-act="del" data-id="${it.id}" ${dis}>削除</button>
    </div>
  </div>`;
}

function doneCard(it) {
  const c = cat(it.cat);
  const dis = online ? "" : "disabled";
  return `<div class="item">
    <div class="row1">
      <div class="icon">${c.icon}</div>
      <div class="name">${esc(it.name)}</div>
    </div>
    <div class="meta"><span>期限 ${fmtFull(it.due)}</span>${it.doneAt ? `<span>${fmtFull(it.doneAt)} に完了</span>` : ""}</div>
    <div class="actions">
      <button class="btn" data-act="undo" data-id="${it.id}" ${dis}>↩ 元に戻す</button>
      <button class="btn danger" data-act="del" data-id="${it.id}" ${dis}>削除</button>
    </div>
  </div>`;
}

// ---- 操作 ----
filters.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  filterCat = b.dataset.cat; render();
});
document.querySelector(".summary").addEventListener("click", e => {
  const b = e.target.closest("[data-st]"); if (!b) return;
  filterSt = filterSt === b.dataset.st ? null : b.dataset.st; render();
});
function onListClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const it = items.find(i => i.id === b.dataset.id); if (!it) return;
  const act = b.dataset.act;
  if (act === "done") {
    if (it.kind === "repeat") {
      if (it.start === todayStr()) return alert("今日すでに「やった」になっています。");
      if (!confirm(`「${it.name}」を今日やったことにしますか？`)) return;
    } else if (it.cycle) {
      if (!confirm(`「${it.name}」を完了にして、次の期限（${cycleText(it.cycle)}）に進めますか？`)) return;
    } else if (!confirm(`「${it.name}」を完了にしますか？\n（下の「完了したもの」に移ります）`)) return;
    send("item/done", { id: it.id });
  } else if (act === "renew") {
    openDialog(it, true);
  } else if (act === "edit") {
    openDialog(it);
  } else if (act === "undo") {
    send("item/undo", { id: it.id });
  } else if (act === "del") {
    if (!confirm(`「${it.name}」を消しますか？\n（2人の一覧から消えます。元に戻せません）`)) return;
    send("item/delete", { id: it.id });
  }
}
list.addEventListener("click", onListClick);
doneList.addEventListener("click", onListClick);

// ---- 追加・編集ダイアログ ----
fCat.innerHTML = CATS.map(c => `<option value="${c.id}">${c.icon} ${c.label}</option>`).join("");

function setKind(kind) {
  formKind = kind;
  kindSeg.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.kind === kind));
  kindHelp.textContent = KINDS[kind].help;
  form.querySelectorAll("[data-for]").forEach(el => { el.hidden = !el.dataset.for.split(" ").includes(kind); });
  fDueLabel.textContent = kind === "period" ? "有効期限（いつまで）" : "期限日";
  fName.placeholder = kind === "repeat" ? "例：歯ブラシ（パパ）" : kind === "once" ? "例：車検（ノア）" : "例：冷蔵庫の保証";
  presets.innerHTML = PRESETS[kind].map(([n, c], i) => `<button type="button" class="chip" data-p="${i}">${cat(c).icon} ${n}</button>`).join("");
}
kindSeg.addEventListener("click", e => {
  const b = e.target.closest("[data-kind]"); if (b) setKind(b.dataset.kind);
});
presets.addEventListener("click", e => {
  const b = e.target.closest("[data-p]"); if (!b) return;
  const [n, c, v] = PRESETS[formKind][b.dataset.p];
  fName.value = n; fCat.value = c;
  if (formKind === "repeat") setIntervalField(v);
  if (formKind === "once") fCycle.value = String(v);
});

function setIntervalField(days) {
  if (days % 365 === 0) { fUnit.value = "365"; fInterval.value = days / 365; }
  else if (days % 30 === 0) { fUnit.value = "30"; fInterval.value = days / 30; }
  else if (days % 7 === 0) { fUnit.value = "7"; fInterval.value = days / 7; }
  else { fUnit.value = "1"; fInterval.value = days; }
}

function openDialog(it, renew) {
  editingId = it ? it.id : null;
  dlgTitle.textContent = renew ? "更新した日を入れてください" : it ? "編集" : "追加";
  setKind(it ? it.kind : formKind);
  kindSeg.hidden = !!it;
  kindHelp.hidden = !!it;
  presetArea.hidden = !!it;
  fName.value = it ? it.name : "";
  fCat.value = it ? it.cat : (formKind === "repeat" ? "bath" : formKind === "once" ? "car" : "home");
  setIntervalField(it && it.kind === "repeat" ? it.interval : 30);
  fStart.value = it && it.kind === "repeat" ? it.start : todayStr();
  fDue.value = it && it.kind !== "repeat" ? it.due : "";
  fCycle.value = String(it && it.kind === "once" ? it.cycle : 0);
  fPStart.value = it && it.kind === "period" ? it.start : "";
  fNotice.value = it && it.notice != null ? String(it.notice) : "";
  if (it && it.notice != null && fNotice.value !== String(it.notice)) fNotice.value = "";
  fMemo.value = it ? (it.memo || "") : "";
  const hist = it && it.history.length
    ? it.history.concat(it.kind === "repeat" ? it.start : it.due) : [];
  fHistory.textContent = hist.length ? "これまで：" + hist.map(fmtFull).join(" → ") : "";
  if (renew) {
    // 更新したとき：使い始めを今日にして、新しい有効期限を入れてもらう
    fPStart.value = todayStr();
    fDue.value = "";
  }
  dlg.showModal();
  if (renew) fDue.focus();
}
btnAdd.onclick = () => openDialog(null);
btnCancel.onclick = () => dlg.close();

form.addEventListener("submit", async e => {
  e.preventDefault();
  const data = {
    id: editingId || "",
    kind: formKind,
    name: fName.value.trim(),
    cat: fCat.value,
    notice: fNotice.value === "" ? null : Number(fNotice.value),
    memo: fMemo.value.trim(),
  };
  if (!data.name) return;
  if (formKind === "repeat") {
    data.interval = Math.max(1, Number(fInterval.value) * Number(fUnit.value));
    data.start = fStart.value || todayStr();
  } else {
    if (!fDue.value) return alert(formKind === "once" ? "期限日を入れてください。" : "有効期限を入れてください。");
    data.due = fDue.value;
    if (formKind === "once") data.cycle = Number(fCycle.value);
    else data.start = fPStart.value;
  }
  if (await send("item", data)) dlg.close();
});

// 別のアプリから戻ってきたら、もう一人の変更を読み直す
document.addEventListener("visibilitychange", () => { if (!document.hidden && !app.hidden) refresh(); });

refresh();

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
